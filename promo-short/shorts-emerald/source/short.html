<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--g:#1FD18B;--g2:#9BF7CF;--g3:#0FB37A;--r:#FF3B5C;--tg:#2AABEE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#030806}
body{font-family:'Space Grotesk',sans-serif;color:#fff;position:relative}
.abs{position:absolute;left:0;top:0}
.mono{font-family:'JetBrains Mono',monospace}
.big{font-family:'Unbounded',sans-serif;font-weight:900;text-transform:uppercase;line-height:.95;white-space:nowrap}
#bg{position:absolute;inset:0}
#stage{position:absolute;inset:0;transform-origin:540px 900px}
.scene{position:absolute;inset:0;display:none}
.glass{background:linear-gradient(160deg,rgba(18,32,26,.94),rgba(8,16,12,.94));border:1px solid rgba(31,209,139,.28);border-radius:34px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 80px rgba(31,209,139,.12)}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:18px;font-family:'JetBrains Mono';font-weight:700;font-size:32px;letter-spacing:1px;background:rgba(31,209,139,.12);border:2px solid rgba(31,209,139,.5);color:var(--g2)}
.chip.w{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.25);color:#eee}
.gnum{background:linear-gradient(180deg,#E9FFF5,#5CFFB7 45%,#0FB37A);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(31,209,139,.55))}
#top{position:absolute;left:60px;right:60px;top:70px;height:90px;display:flex;align-items:center;gap:18px;z-index:50}
#caps{position:absolute;left:50px;right:50px;top:1490px;text-align:center;z-index:60}
#capsIn{display:inline-block;font-weight:700;font-size:68px;line-height:1.18;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.9),0 0 2px #000}
#capsIn span{display:inline-block;margin:0 9px;transition:none}
#foot{position:absolute;left:60px;right:60px;top:1800px;font-family:'JetBrains Mono';font-size:22px;line-height:1.4;color:rgba(255,255,255,.45);text-align:center;z-index:55}
#prog{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--g3),var(--g2));z-index:70}
#flash{position:absolute;inset:0;background:#d9ffee;opacity:0;z-index:90;pointer-events:none}
#grain{position:absolute;inset:-60px;opacity:.03;mix-blend-mode:overlay;pointer-events:none;z-index:95}
.logo{border-radius:50%;object-fit:cover;box-shadow:0 0 0 6px rgba(31,209,139,.5),0 20px 60px rgba(0,0,0,.6)}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="stage"></div>
<div id="top"><svg width="64" height="64" viewBox="-110 -110 220 220"><path d="M0-105 C8-20 20-8 105 0 C20 8 8 20 0 105 C-8 20 -20 8 -105 0 C-20 -8 -8 -20 0 -105Z" fill="#1FD18B"/><circle r="12" fill="#EAFFF5"/></svg>
 <div style="font-weight:700;font-size:40px;letter-spacing:-.5px">DCA SOLANA <span style="color:#1FD18B">TRADE</span></div>
 <div class="mono" style="margin-left:auto;font-size:24px;padding:10px 18px;border-radius:30px;border:2px solid rgba(31,209,139,.6);color:#9BF7CF;display:flex;align-items:center;gap:10px"><i id="dot" style="width:12px;height:12px;border-radius:50%;background:#1FD18B;display:block"></i><span id="mon">МОНИТОРИНГ V3</span></div></div>
<div id="caps"><div id="capsIn"></div></div>
<div id="foot"></div>
<canvas id="grain" width="540" height="1000"></canvas>
<div id="flash"></div>
<div id="prog"></div>
<script>document.write('<script src="data_' + (new URLSearchParams(location.search).get('id') || 'sA') + '.js"><\/script>')</script>
<script src="short.js"></script>
</body></html>
