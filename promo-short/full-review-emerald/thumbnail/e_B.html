<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#030806}
body{font-family:'Space Grotesk',sans-serif;color:#fff;position:relative}
.abs{position:absolute}
.big{font-family:'Unbounded',sans-serif;font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-2px}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
#bg{position:absolute;inset:0;background:
  radial-gradient(1100px 820px at 74% 58%,rgba(31,209,139,.42),transparent 62%),
  radial-gradient(760px 560px at 6% 8%,rgba(20,184,196,.22),transparent 60%),
  radial-gradient(700px 500px at 100% 0%,rgba(155,247,207,.16),transparent 60%),#030806}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(31,209,139,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,209,139,.08) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 70% 60%,#000 25%,transparent 75%)}
.win{border-radius:18px;overflow:hidden;background:#0b0f0d;box-shadow:0 0 0 2px rgba(31,209,139,.35),0 50px 120px rgba(0,0,0,.85),0 0 120px rgba(31,209,139,.25)}
.bar{height:40px;background:#111815;display:flex;align-items:center;gap:9px;padding:0 16px}
.bar i{width:13px;height:13px;border-radius:50%;display:block}
.win img{display:block;width:100%}
.card{border-radius:20px;overflow:hidden;box-shadow:0 0 0 3px #1FD18B,0 0 90px rgba(31,209,139,.55),0 40px 100px rgba(0,0,0,.85)}
.card img{display:block;width:100%}
.phone{border-radius:52px;background:#0c100e;padding:11px;box-shadow:0 0 0 3px #1d2a24,0 40px 100px rgba(0,0,0,.85),0 0 90px rgba(31,209,139,.4)}
.phone .scr{border-radius:42px;overflow:hidden}.phone img{display:block;width:100%}
.chip{display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:14px;font-family:'JetBrains Mono';font-weight:700;font-size:30px;letter-spacing:1px}
.coin{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E9FFF5,#3CF0A6 40%,#0B8F5E);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 40px rgba(31,209,139,.6),inset 0 -6px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:Unbounded;font-weight:900;color:#04412a}
.star{position:absolute}
</style></head><body>
<div id="bg"></div><div id="grid"></div>
<div class="abs" style="left:1010px;top:130px;width:1150px;perspective:2200px;"><div class="win" style="transform:rotateY(-16deg) rotateX(5deg);transform-origin:0 50%"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="mono" style="margin-left:16px;font-size:16px;color:#9BF7CF;font-weight:500">jupiter-dca-bot.online</span></div><img src="e_landing.png"></div></div>
<div class="abs" style="left:1520px;top:380px;width:330px;transform:rotate(6deg)"><div class="phone"><div class="scr"><img src="e_phone_trading.png"></div></div></div>
<div class="abs" style="left:1330px;top:930px;display:flex;align-items:center;gap:14px;padding:12px 22px 12px 12px;border-radius:50px;background:rgba(8,20,16,.92);border:2px solid #2AABEE;box-shadow:0 0 40px rgba(42,171,238,.5)"><div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#37BBFE,#007DBB);display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24"><path fill="#fff" d="M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.2c.3-1.3-.5-1.9-1.9-1.5z"/></svg></div><span style="font-weight:700;font-size:28px">+ Telegram Mini App</span></div>
<div class="abs" style="left:0;top:0;width:1160px;height:1080px;background:linear-gradient(90deg,rgba(3,8,6,.96) 55%,rgba(3,8,6,0))"></div>
<div class="abs" style="left:76px;top:66px"><div class="chip" style="background:#1FD18B;color:#03140c">▶ НОВЫЙ САЙТ · ПОЛНЫЙ ОБЗОР</div></div>
<div class="abs big" style="left:70px;top:180px;font-size:100px;text-shadow:0 10px 40px rgba(0,0,0,.6)">ВХОДИ<br>С <span style="color:#1FD18B">КИТОМ.</span></div>
<div class="abs big" style="left:70px;top:390px;font-size:100px">ВЫХОДИ<br><span style="color:transparent;-webkit-text-stroke:3px #1FD18B">ВОВРЕМЯ.</span></div>
<div class="abs" style="left:80px;top:700px;display:flex;align-items:center;gap:20px"><svg class="star" style="position:static;width:70px;height:70px" viewBox="-110 -110 220 220"><path d="M0-105 C8-20 20-8 105 0 C20 8 8 20 0 105 C-8 20 -20 8 -105 0 C-20 -8 -8 -20 0 -105Z" fill="#1FD18B"/><circle r="12" fill="#EAFFF5"/></svg><div style="font-weight:700;font-size:60px;letter-spacing:-1px">DCA SOLANA <span style="color:#1FD18B">TRADE</span></div></div>
<div class="abs" style="left:80px;top:820px;display:flex;gap:16px"><div class="chip" style="background:rgba(31,209,139,.16);border:2px solid #1FD18B;color:#9BF7CF;font-size:26px">КОПИ-ТРЕЙДИНГ</div><div class="chip" style="background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3);font-size:26px">SOLANA · JUPITER</div><div class="chip" style="background:rgba(42,171,238,.15);border:2px solid #2AABEE;font-size:26px">24/7</div></div>
</body></html>
